<!--
  sidepanel.html
  Dev Formatter Pro — Clean Apple-inspired UI (Zero Duplicate Headers)
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Formatter Pro</title>
  <!-- CodeMirror Base Styles -->
  <link rel="stylesheet" href="codemirror/codemirror.min.css">
  <link rel="stylesheet" href="codemirror/addon/fold/foldgutter.min.css">
  <!-- Dynamic Theme Link for CodeMirror themes -->
  <link id="cmDynamicTheme" rel="stylesheet" href="">
  <!-- App Styles -->
  <link rel="stylesheet" type="text/css" href="styles/style.css">
</head>

<body>
  <div class="app-container">
    <!-- Input Pane -->
    <div class="pane-container" id="inputArea">
      <!-- Floating Top Bar -->
      <div class="floating-bar top-bar">
        <!-- Left: Segmented Mode Control -->
        <div class="segmented-control">
          <button class="segment-btn active" data-mode="auto" title="Auto-detect format">
            <svg class="icon icon-sparkle" viewBox="0 0 16 16" fill="currentColor">
              <path
                d="M7.657 1.343a.5.5 0 0 1 .686 0l1.458 1.458a4.5 4.5 0 0 0 3.182 1.318h.005a.5.5 0 0 1 .472.472v.005a4.5 4.5 0 0 0 1.318 3.182l1.458 1.458a.5.5 0 0 1 0 .686l-1.458 1.458a4.5 4.5 0 0 0-1.318 3.182v.005a.5.5 0 0 1-.472.472h-.005a4.5 4.5 0 0 0-3.182 1.318l-1.458 1.458a.5.5 0 0 1-.686 0l-1.458-1.458a4.5 4.5 0 0 0-3.182-1.318H3.69a.5.5 0 0 1-.472-.472v-.005a4.5 4.5 0 0 0-1.318-3.182L.442 9.458a.5.5 0 0 1 0-.686l1.458-1.458A4.5 4.5 0 0 0 3.218 4.13v-.005a.5.5 0 0 1 .472-.472h.005a4.5 4.5 0 0 0 3.182-1.318l1.458-1.458z" />
            </svg>
            <span>Auto</span>
          </button>
          <button class="segment-btn" data-mode="json">JSON</button>
          <button class="segment-btn" data-mode="sql">SQL</button>
        </div>

        <!-- Right: Code Theme Picker & Cursor Pill -->
        <div class="top-controls-right">
          <div class="select-wrapper theme-select-wrapper" title="Select Code Theme">
            <svg class="theme-palette-icon" viewBox="0 0 16 16" fill="currentColor">
              <path
                d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm.5 5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm-4 3a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm1 4.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm6.5-1.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z" />
            </svg>
            <select id="editorThemeSelect" class="glass-select theme-select" aria-label="Editor Theme"></select>
            <svg class="select-chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 4.5L6 7.5L9 4.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <span class="glass-pill cursor-pill" id="cursorPos" title="Cursor Line:Column">1:1</span>
        </div>
      </div>

      <!-- Editor Canvas -->
      <div class="editor-wrapper">
        <div id="jsonInputEditor"></div>
        <div class="editor-watermark" id="inputWatermark">Paste or type JSON or SQL…</div>
      </div>
    </div>

    <!-- Minimal Hairline Splitter with Pill Handle -->
    <div class="splitter-hairline" id="splitter">
      <div class="splitter-grip"></div>
    </div>

    <!-- Output Pane -->
    <div class="pane-container" id="outputArea">
      <!-- Floating Output Bar -->
      <div class="floating-bar">
        <div class="meta-pills">
          <span class="glass-badge" id="jsonBadge">JSON</span>
          <div class="select-wrapper" id="dialectWrapper">
            <select id="dialectSelect" class="glass-select" aria-label="SQL Dialect"></select>
            <svg class="select-chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 4.5L6 7.5L9 4.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <span class="detected-hint" id="detectedHint"></span>
          <button type="button" id="errorPill" class="glass-pill error-pill" hidden title="Jump to parse error"></button>
        </div>

        <div class="output-actions">
          <div class="json-tools" id="jsonTools" hidden>
            <button type="button" id="minifyBtn" class="glass-pill action-pill minify-btn" title="Toggle compact JSON">Minify</button>
            <button type="button" id="escapeBtn" class="glass-pill action-pill icon-pill" title="Escape as JSON string" aria-label="Escape as JSON string">
              <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M5.5 3.5L2.5 8l3 4.5M10.5 3.5L13.5 8l-3 4.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" id="unescapeBtn" class="glass-pill action-pill icon-pill" title="Unescape JSON string" aria-label="Unescape JSON string">
              <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M2.5 3.5L5.5 8l-3 4.5M13.5 3.5L10.5 8l3 4.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <button id="copyBtn" class="glass-pill action-pill copy-btn" title="Copy formatted code">
            <span class="btn-icon-wrapper" id="copyIconSlot">
              <svg class="icon icon-copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="5.5" y="5.5" width="8" height="8" rx="2" />
                <path d="M3.5 10.5H3a1.5 1.5 0 0 1-1.5-1.5V3A1.5 1.5 0 0 1 3 1.5h6A1.5 1.5 0 0 1 10.5 3v.5"
                  stroke-linecap="round" />
              </svg>
            </span>
            <span class="btn-label" id="copyLabel">Copy</span>
          </button>
        </div>
      </div>

      <!-- Editor Canvas -->
      <div class="editor-wrapper">
        <div id="jsonOutputEditor"></div>
      </div>
    </div>
  </div>

  <!-- CodeMirror & Modes -->
  <script src="codemirror/codemirror.min.js"></script>
  <script src="codemirror/javascript.min.js"></script>
  <script src="codemirror/mode/sql/sql.js"></script>
  <script src="codemirror/addon/fold/foldcode.min.js"></script>
  <script src="codemirror/addon/fold/foldgutter.min.js"></script>
  <script src="codemirror/addon/fold/brace-fold.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
